[package]
name = "oauth" # the name of the package
version = "0.1.0"    # the current version, obeying semver
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.149"
actix-files = "0.6.8"

actix-session = {version = "0.8", features = ["cookie-session"]}
actix-web-httpauth = "0.8"
reqwest = { version = "0.12", features = ["json"] }
dotenv = "0.15.0"
actix-web-lab = "0.26.0"

jsonwebtoken = "9.2"
chrono = "0.4"
rand = "0.8"
bcrypt = "0.15"

sqlx = {version = "0.8.2", features = ["postgres", "macros", "runtime-tokio-native-tls"]}
