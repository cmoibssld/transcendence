services:
    db:
        image: postgres:16
        container_name: capu_db
        restart: unless-stopped
        environment:
            POSTGRES_USER: diesel
            POSTGRES_PASSWORD: dieselpass
            POSTGRES_DB: transcendance
        ports:
            - "5433:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U diesel -d transcendance"]
            interval: 5s
            timeout: 5s
            retries: 10

    api:
        image: node:20-alpine
        container_name: capu_api
        working_dir: /app
        command: sh -c "npm install && npm run dev"
        environment:
            PORT: 3001
            DATABASE_URL: postgres://diesel:dieselpass@db:5432/transcendance
            FRONTEND_ORIGIN: http://localhost:5173
            HTTPS_KEY_PATH: ./certs/dev-key.pem
            HTTPS_CERT_PATH: ./certs/dev-cert.pem
        volumes:
            - ./api:/app
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "3001:3001"

volumes:
    pgdata:
