services:
    db:
        image: docker.io/library/postgres:16
        container_name: transcendance_db
        restart: unless-stopped
        environment:
            POSTGRES_USER: diesel
            POSTGRES_PASSWORD: dieselpass
            POSTGRES_DB: transcendance
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U diesel -d transcendance"]
            interval: 5s
            timeout: 5s
            retries: 10

    api:
        build:
            context: .
            dockerfile: docker/api.Dockerfile
        container_name: transcendance_api
        restart: unless-stopped
        environment:
            DATABASE_URL: postgres://diesel:dieselpass@db:5432/transcendance
            API_HOST: 0.0.0.0
            API_PORT: 3443
            TLS_CERT_FILE: certs/dev-cert.pem
            TLS_KEY_FILE: certs/dev-key.pem
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "3443:3443"

    dev:
        build:
            context: .
            dockerfile: docker/dev.Dockerfile
        container_name: transcendance_dev
        restart: unless-stopped
        working_dir: /app
        environment:
            CARGO_HOME: /usr/local/cargo
            RUSTUP_HOME: /usr/local/rustup
            DATABASE_URL: postgres://diesel:dieselpass@db:5432/transcendance
            API_HOST: 0.0.0.0
            API_PORT: 3443
            TLS_CERT_FILE: /app/certs/dev-cert.pem
            TLS_KEY_FILE: /app/certs/dev-key.pem
        volumes:
            - .:/app
            - ${HOME}/goinfre/.cargo:/usr/local/cargo
            - ${HOME}/goinfre/.rustup:/usr/local/rustup
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "3443:3443"
        tty: true
        stdin_open: true
        command: ["sleep", "infinity"]

volumes:
    pgdata:
