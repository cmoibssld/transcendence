services:
  db:
    image: docker.io/library/postgres:16
    container_name: transcendance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: diesel
      POSTGRES_PASSWORD: dieselpass
      POSTGRES_DB: transcendance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diesel -d transcendance"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - transcendance

  api:
    build:
      context: db
      dockerfile: docker/api.Dockerfile
    container_name: transcendance_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://diesel:dieselpass@db:5432/transcendance
      API_HOST: 0.0.0.0
      API_PORT: 3443
      TLS_CERT_FILE: certs/dev-cert.pem
      TLS_KEY_FILE: certs/dev-key.pem
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3443:3443"
    networks:
      - transcendance

  dev:
    build:
      context: db
      dockerfile: docker/dev.Dockerfile
    container_name: transcendance_dev
    restart: unless-stopped
    working_dir: /app
    environment:
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
      DATABASE_URL: postgres://diesel:dieselpass@db:5432/transcendance
      API_HOST: 0.0.0.0
      API_PORT: 3443
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db:/app
    networks:
      - transcendance
    profiles:
      - dev
    stdin_open: true
    tty: true

  oauth:
    build:
      context: oauth
      dockerfile: Dockerfile
    container_name: transcendance_oauth
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://diesel:dieselpass@db:5432/transcendance
      JWT_SECRET: ${JWT_SECRET:-your-secret-key}
      GITHUB_ID: ${GITHUB_ID}
      GITHUB_SECRET: ${GITHUB_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendance

  frontend:
    build:
      context: front-end
      dockerfile: Dockerfile
    container_name: transcendance_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - oauth
    environment:
      VITE_AUTH_URL: http://localhost:8081
    networks:
      - transcendance

  frontend-dev:
    build:
      context: front-end
      dockerfile: Dockerfile.dev
    container_name: transcendance_frontend_dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./front-end:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - transcendance
    profiles:
      - dev

networks:
  transcendance:
    driver: bridge

volumes:
  pgdata:
