services:
  db:
    image: docker.io/library/postgres:16
    container_name: transcendance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: diesel
      POSTGRES_PASSWORD: dieselpass # FORBIDDEN
      POSTGRES_DB: transcendance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diesel -d transcendance"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - transcendance

  api:
    build:
      context: db
      dockerfile: docker/api.Dockerfile
    container_name: transcendance_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://diesel:dieselpass@db:5432/transcendance
      API_HOST: 0.0.0.0
      API_PORT: 3443
      TLS_CERT_FILE: certs/dev-cert.pem
      TLS_KEY_FILE: certs/dev-key.pem
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendance

  oauth:
    build:
      context: oauth
      dockerfile: Dockerfile
    container_name: transcendance_oauth
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://diesel:dieselpass@db:5432/transcendance
      JWT_SECRET: ${JWT_SECRET:-your-secret-key}
      GITHUB_ID: ${GITHUB_ID}
      GITHUB_SECRET: ${GITHUB_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendance

  frontend:
    build:
      context: front-end
      dockerfile: Dockerfile
    container_name: transcendance_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - oauth
      - reverse-proxy
    environment:
      VITE_AUTH_URL: http://localhost:8081
      VITE_GAME_URL: http://localhost:8080
      VITE_CHAT_URL: http://localhost:8080
    networks:
      - transcendance

  game-engine:
    build:
      context: docker/game-engine
      dockerfile: Dockerfile
    container_name: transcendance_game_engine
    restart: unless-stopped
    networks:
      - transcendance

  reverse-proxy:
    build:
      context: reverse-proxy
      dockerfile: Dockerfile
    container_name: transcendance_reverse_proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - transcendance

  ws-service:
    build:
      context: ws_service
      dockerfile: Dockerfile
    container_name: ws_service
    restart: unless-stopped
    networks:
      - transcendance

networks:
  transcendance:
    driver: bridge

volumes:
  pgdata:
