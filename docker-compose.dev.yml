services:
  frontend:
    build:
      context: front-end
      dockerfile: Dockerfile.dev
    container_name: transcendance_frontend_dev
    ports:
      - "5173:5173"
    volumes:
      - ./front-end:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      VITE_AUTH_URL: http://localhost:8081
      VITE_GAME_URL: http://localhost:8080
      VITE_CHAT_URL: http://localhost:8080
      VITE_WS_URL: ws://localhost:8080/ws

  game-engine:
    build:
      context: docker/game-engine
      dockerfile: Dockerfile.dev
    container_name: transcendance_game_engine_dev
    working_dir: /usr/src/game-engine
    volumes:
      - ./docker/game-engine:/usr/src/game-engine
      - /usr/local/cargo
      - /usr/local/rustup
    environment:
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
      RUST_LOG: debug

  chat:
    build:
      context: chat
      dockerfile: Dockerfile.dev
    container_name: transcendance_chat_dev
    working_dir: /usr/src/chat
    volumes:
      - ./chat:/usr/src/chat
      - /usr/local/cargo
      - /usr/local/rustup
    environment:
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
      CHAT_HOST: 0.0.0.0
      CHAT_PORT: 8090