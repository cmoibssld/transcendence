daemon off;

events {
	worker_connections 1024;
}

http {
	upstream oauth        { server oauth:8081; }
	upstream game_engine  { server game-engine:8080; }
	upstream stats        { server stats-service:8083; }
	upstream chat         { server chat:8090; }
	upstream ws_service   { server ws-service:8082; }
	upstream frontend     { server frontend:3000; }

	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	# HTTP → HTTPS redirect
	server {
		listen 8080;
		server_name _;
		return 301 https://$host:8443$request_uri;
	}

	server {
		listen 443 ssl;
		server_name _;

		ssl_certificate     /etc/nginx/certs/dev-cert.pem;
		ssl_certificate_key /etc/nginx/certs/dev-key.pem;
		ssl_protocols       TLSv1.2 TLSv1.3;
		ssl_prefer_server_ciphers off;

		# Security headers
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header X-XSS-Protection "1; mode=block" always;
		add_header Content-Security-Policy "default-src 'self' https://localhost:8443; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' wss://localhost:8443 https://localhost:8443; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net;" always;

		# GitHub OAuth callback lands on the frontend SPA
		location = /auth/callback {
			proxy_pass       http://frontend;
			proxy_set_header Host            $host;
			proxy_set_header X-Real-IP       $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

		# Block internal-only auth endpoints
		location ~ ^/auth/(introspect|internal) {
			return 403;
		}

		# Block internal game-engine and chat endpoints from public access
		location ~ ^/api/game/(ws/ingest|internal) {
			return 403;
		}
		location ~ ^/api/chat/ws/message {
			return 403;
		}

		# Auth service
		location /auth/ {
			proxy_pass         https://oauth;
			proxy_ssl_verify   off;
			proxy_set_header   Host              $host;
			proxy_set_header   X-Real-IP         $remote_addr;
			proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_set_header   X-Forwarded-Proto $scheme;
		}

		# WebSocket gateway
		location /ws {
			proxy_pass         https://ws_service/ws;
			proxy_ssl_verify   off;
			proxy_http_version 1.1;
			proxy_set_header   Upgrade           $http_upgrade;
			proxy_set_header   Connection        $connection_upgrade;
			proxy_set_header   Host              $host;
			proxy_set_header   X-Real-IP         $remote_addr;
			proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_read_timeout 3600s;
		}

		# Stats — rerouted transparently (frontend URLs unchanged)
		location /api/game/history {
			proxy_pass         https://stats/history;
			proxy_ssl_verify   off;
			proxy_set_header   Host              $host;
			proxy_set_header   X-Real-IP         $remote_addr;
			proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_set_header   X-Forwarded-Proto $scheme;
		}

		location /api/game/stats/ {
			proxy_pass         https://stats/stats/;
			proxy_ssl_verify   off;
			proxy_set_header   Host              $host;
			proxy_set_header   X-Real-IP         $remote_addr;
			proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_set_header   X-Forwarded-Proto $scheme;
		}

		location /api/game/leaderboard/ {
			proxy_pass         https://stats/leaderboard/;
			proxy_ssl_verify   off;
			proxy_set_header   Host              $host;
			proxy_set_header   X-Real-IP         $remote_addr;
			proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_set_header   X-Forwarded-Proto $scheme;
		}

		# Game engine
		location /api/game/ {
			proxy_pass         https://game_engine/;
			proxy_ssl_verify   off;
			proxy_set_header   Host              $host;
			proxy_set_header   X-Real-IP         $remote_addr;
			proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_set_header   X-Forwarded-Proto $scheme;
		}

		# Chat service — strip /api/chat prefix, support WS upgrades
		location /api/chat/ {
			proxy_pass         https://chat/;
			proxy_ssl_verify   off;
			proxy_http_version 1.1;
			proxy_set_header   Upgrade           $http_upgrade;
			proxy_set_header   Connection        $connection_upgrade;
			proxy_set_header   Host              $host;
			proxy_set_header   X-Real-IP         $remote_addr;
			proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_read_timeout 3600s;
		}

		# Frontend SPA — catch-all
		location / {
			proxy_pass       http://frontend;
			proxy_set_header Host            $host;
			proxy_set_header X-Real-IP       $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}
	}
}
