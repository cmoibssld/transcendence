# use nginx as reverse proxy -> nginx will forward alse the websocket connection
daemon off;

events {
	worker_connections 1024;
}

http {
	upstream websocket_game {
		server game-engine:8080;
	}


	map $http_upgrade $connection_upgrade {
		default	upgrade;
		''		close;
	}

	server {
listen 3000;
		server_name luigijack.com;

		location /ws {
			proxy_pass https://game-engine:8080/ws;
			proxy_ssl_certificate		/run/secrets/cert.pem;
			proxy_ssl_certificate_key	/run/secrets/key.pem;
			proxy_http_version	1.1;
			proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
		}
		
		location /test {
			proxy_pass https://game-engine:8080/test;
			proxy_ssl_certificate		/run/secrets/cert.pem;
			proxy_ssl_certificate_key	/run/secrets/key.pem;

			proxy_set_header Host $host;
        	proxy_set_header X-Real-IP $remote_addr;
        	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        	proxy_set_header X-Forwarded-Proto $scheme;
		}

		location / {
			proxy_pass https://game-engine:8080;
			proxy_ssl_certificate		/run/secrets/cert.pem;
			proxy_ssl_certificate_key	/run/secrets/key.pem;
			proxy_set_header Host $host;
        	proxy_set_header X-Real-IP $remote_addr;
        	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        	proxy_set_header X-Forwarded-Proto $scheme;
		}
		
	}
}
