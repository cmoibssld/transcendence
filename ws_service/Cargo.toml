[package]
name = "ws_service"
version = "0.1.0"
edition = "2024"

[dependencies]
actix = "0.13"
actix-web = "4.13.0"
actix-web-actors = "4.3"
env_logger = "0.10"
log = "0.4"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros"] }
