[package]
name = "game-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web   = { version = "4", features = ["openssl"] }
openssl     = "0.10"
serde_json  = "1"
serde       = { version = "1.0", features = ["derive"] }
rand        = "0.10.1"
getrandom   = "0.3"
reqwest     = { version = "0.12", features = ["json"] }
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
log         = "0.4"
env_logger  = "0.10"
dotenv      = "0.15"
time        = "=0.3.47"
