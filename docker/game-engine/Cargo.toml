[package]
name = "game-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
rand = "0.10.1"
getrandom = "0.3"
diesel = { version = "2.2", features = ["postgres", "r2d2", "chrono"] }
diesel_migrations = "2.2"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.10"
dotenv = "0.15"
