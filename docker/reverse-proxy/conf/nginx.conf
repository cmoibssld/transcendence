# use nginx as reverse proxy -> nginx forwards websocket traffic to the game engine
daemon off;

events {
	worker_connections 1024;
}

http {
	upstream game_engine {
		server game-engine:8080;
	}

	upstream chat_service {
		server chat:8090;
	}

	upstream frontend_app {
		server frontend:3000;
	}


	map $http_upgrade $connection_upgrade {
		default	upgrade;
		''		close;
	}

	server {
		listen 8080;
		server_name _;

		add_header Access-Control-Allow-Origin * always;
		add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
		add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

		location /ws/ {
			proxy_pass http://game_engine/ws/;
			proxy_http_version	1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
		}
		
		location /test {
			proxy_pass http://game_engine/test;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /tables {
			proxy_pass http://game_engine/tables;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /chat/ws/ {
			proxy_pass http://chat_service/ws/;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location / {
			proxy_pass http://frontend_app;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
		
	}
}
