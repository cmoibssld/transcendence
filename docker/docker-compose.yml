services:
  game-engine:
    container_name: game-engine
    build: game-engine
    restart: always
    networks:
      - transcendance
    # ports:
    #   - "8080:8080"
    secrets:
      - cert.pem
      - key.pem

  reverse-proxy:
    container_name: reverse-proxy
    build: reverse-proxy
    restart: always
    ports:
      - "3000:3000"
    networks:
      - transcendance
    secrets:
      - cert.pem
      - key.pem

networks:
  transcendance:

secrets:
  cert.pem:
    file: secrets/cert.pem
  key.pem:
    file: secrets/key.pem
